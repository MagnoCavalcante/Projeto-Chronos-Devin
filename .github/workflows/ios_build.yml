name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.44.7'
  WORKING_DIRECTORY: app

jobs:
  build_ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Instalar dependências (flutter pub get)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: flutter pub get

      - name: Executar testes automatizados
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: flutter test

      - name: Compilar IPA (Release, sem assinatura)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: flutter build ipa --release --no-codesign

      - name: Publicar artefato (Runner.xcarchive)
        uses: actions/upload-artifact@v4
        with:
          name: chronos-ios-xcarchive
          path: ${{ env.WORKING_DIRECTORY }}/build/ios/archive/Runner.xcarchive
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar artefato (build/ios/ipa)
        uses: actions/upload-artifact@v4
        with:
          name: chronos-ios-ipa
          path: ${{ env.WORKING_DIRECTORY }}/build/ios/ipa
          if-no-files-found: warn
          retention-days: 14
